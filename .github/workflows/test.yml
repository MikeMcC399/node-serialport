name: Test / Lint
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
          - 27-nightly
        os:
          - macos-26-intel
          - ubuntu-26.04
          - windows-2025-vs2026
          - macos-26 # arm64
          - ubuntu-26.04-arm
          - windows-11-arm

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
